<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electrical Safety & OSHA Standards | VoltCE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#1a202c;font-size:15px;line-height:1.6}

/* HEADER */
.hdr{background:#7B1B1B;padding:13px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,0.25)}
.logo{font-size:17px;font-weight:700;color:#fff;letter-spacing:-0.3px}.logo span{opacity:0.55;font-weight:300}
.hdr-right{display:flex;align-items:center;gap:16px}
.hdr-timer{font-size:13px;color:rgba(255,255,255,0.8);background:rgba(0,0,0,0.2);padding:4px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.hdr-prog{display:flex;align-items:center;gap:8px}
.prog-bg{width:120px;height:5px;background:rgba(255,255,255,0.2);border-radius:3px}
.prog-fill{height:5px;background:#F4A261;border-radius:3px;transition:width 0.5s}
.prog-pct{font-size:12px;color:rgba(255,255,255,0.7)}

/* LAYOUT */
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 40px}

/* COURSE INFO BAR */
.cinfo{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px 20px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.cinfo-title{font-size:17px;font-weight:700;letter-spacing:-0.3px;margin-bottom:6px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11.5px;padding:3px 10px;border-radius:999px;background:#f1f5f9;color:#64748b}
.pill.red{background:#FEE2E2;color:#991B1B}
.cinfo-time{text-align:right;min-width:110px}
.cinfo-time-big{font-size:22px;font-weight:700;color:#7B1B1B;line-height:1}
.cinfo-time-lbl{font-size:11px;color:#94a3b8;margin-top:2px}

/* MODULE NAV */
.mod-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.mbtn{font-size:12px;padding:6px 14px;border-radius:999px;border:1.5px solid #e2e8f0;background:#fff;color:#64748b;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.mbtn.active{background:#7B1B1B;color:#fff;border-color:#7B1B1B}
.mbtn.done{background:#FEF3C7;color:#92400E;border-color:#D97706}
.mbtn.locked{opacity:0.4;cursor:not-allowed}

/* CARDS */
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:24px 26px;margin-bottom:14px}

/* VIDEO PLACEHOLDER */
.vid-wrap{background:#1a1a2e;border-radius:12px;padding:0;margin:16px 0;overflow:hidden;position:relative}
.vid-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:220px;gap:12px;padding:32px}
.vid-icon{width:64px;height:64px;border-radius:50%;background:rgba(244,162,97,0.2);border:2px solid rgba(244,162,97,0.4);display:flex;align-items:center;justify-content:center}
.vid-icon svg{width:28px;height:28px;fill:#F4A261}
.vid-title{font-size:15px;font-weight:600;color:#fff;text-align:center}
.vid-sub{font-size:12px;color:rgba(255,255,255,0.5);text-align:center}
.vid-dur{display:inline-block;background:rgba(244,162,97,0.15);color:#F4A261;font-size:11px;padding:3px 10px;border-radius:999px;margin-top:4px}
.vid-url-row{display:flex;gap:8px;width:100%;max-width:420px;margin-top:8px}
.vid-url-input{flex:1;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:#fff;font-size:12px;outline:none}
.vid-url-input::placeholder{color:rgba(255,255,255,0.3)}
.vid-url-btn{padding:8px 14px;border-radius:8px;border:none;background:#F4A261;color:#1a1a2e;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.vid-frame{width:100%;aspect-ratio:16/9;border:none;display:none}

/* SLIDE CONTENT */
.slide-tag{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.s-num{font-size:11px;color:#94a3b8;background:#f8fafc;padding:3px 10px;border-radius:999px}
.s-pill{font-size:11px;padding:3px 10px;border-radius:999px;background:#FEE2E2;color:#991B1B}
.slide-title{font-size:20px;font-weight:700;margin-bottom:12px;letter-spacing:-0.4px;line-height:1.3}
.slide-body{font-size:14px;color:#475569;line-height:1.8;margin-bottom:4px}

/* CONTENT BLOCKS */
.keypoint{background:#FFF7ED;border-left:3px solid #C2410C;border-radius:0 10px 10px 0;padding:14px 18px;margin:16px 0;font-size:13.5px;color:#431407;line-height:1.7}
.warning{background:#FEF2F2;border-left:3px solid #991B1B;border-radius:0 10px 10px 0;padding:14px 18px;margin:16px 0;font-size:13.5px;color:#450A0A;line-height:1.7}
.info-box{background:#F0F9FF;border-left:3px solid #0369A1;border-radius:0 10px 10px 0;padding:14px 18px;margin:16px 0;font-size:13.5px;color:#0C4A6E;line-height:1.7}
.code-ref{display:inline-block;background:#FEE2E2;color:#991B1B;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600;margin:2px}

.bullets{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.bi{font-size:13.5px;color:#374151;padding-left:20px;position:relative;line-height:1.7}
.bi::before{content:'';position:absolute;left:5px;top:9px;width:6px;height:6px;border-radius:50%;background:#C2410C}

.dtable{width:100%;border-collapse:collapse;font-size:13px;margin:16px 0;border-radius:10px;overflow:hidden}
.dtable th{background:#7B1B1B;color:#fff;padding:10px 14px;text-align:left;font-weight:500}
.dtable td{padding:10px 14px;border-bottom:1px solid #f1f5f9;color:#475569}
.dtable tr:nth-child(even) td{background:#fafafa}
.dtable tr:last-child td{border-bottom:none}

.def-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.def-card{background:#f8fafc;border-radius:10px;padding:14px;border:1px solid #e2e8f0}
.def-term{font-size:13px;font-weight:600;color:#7B1B1B;margin-bottom:5px}
.def-body{font-size:12.5px;color:#64748b;line-height:1.65}

.step-list{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.step-row{display:flex;gap:14px;align-items:flex-start}
.step-num{width:30px;height:30px;min-width:30px;border-radius:50%;background:#7B1B1B;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step-text{font-size:13.5px;color:#374151;line-height:1.7;padding-top:4px}

.ppe-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
.ppe-cat{border-radius:10px;padding:14px;border:2px solid}
.ppe-num{font-size:13px;font-weight:700;margin-bottom:3px}
.ppe-cal{font-size:12px;font-weight:600;margin-bottom:6px}
.ppe-items{font-size:11.5px;line-height:1.65;opacity:0.85}

.hierarchy{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.hier-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px}
.hier-num{font-size:13px;font-weight:700;min-width:22px}
.hier-title{font-size:13.5px;font-weight:600;margin-bottom:2px}
.hier-sub{font-size:12px;opacity:0.75}

/* TIMER OVERLAY on slide */
.slide-timer{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#FFF7ED;border:1px solid #FED7AA;border-radius:10px;margin-top:16px;font-size:13px;color:#92400E}
.slide-timer .t-icon{font-size:16px}
.slide-timer .t-remaining{font-weight:600;font-variant-numeric:tabular-nums;min-width:40px}
.slide-timer .t-bar-bg{flex:1;height:4px;background:#FED7AA;border-radius:2px}
.slide-timer .t-bar-fill{height:4px;background:#C2410C;border-radius:2px;transition:width 1s linear}

/* MODULE TIMER */
.mod-timer-bar{background:#FEF3C7;border:1px solid #FDE68A;border-radius:10px;padding:10px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;color:#78350F}
.mod-timer-bar .mt-time{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;min-width:48px}
.mod-timer-bar .mt-bar-bg{flex:1;height:5px;background:#FDE68A;border-radius:3px}
.mod-timer-bar .mt-bar-fill{height:5px;background:#D97706;border-radius:3px;transition:width 1s linear}
.mod-timer-bar .mt-label{font-size:11px;color:#92400E;white-space:nowrap}

/* NAV ROW */
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:8px}
.btn-prev{padding:10px 20px;border-radius:10px;border:1.5px solid #e2e8f0;background:#fff;font-size:13px;color:#374151;cursor:pointer;transition:all 0.15s}
.btn-prev:hover{border-color:#7B1B1B;color:#7B1B1B}
.btn-next{padding:10px 24px;border-radius:10px;border:none;background:#7B1B1B;color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s}
.btn-next:hover:not(:disabled){background:#5c1414}
.btn-next:disabled{background:#9ca3af;cursor:not-allowed}
.btn-locked-msg{font-size:12px;color:#92400E;background:#FFF7ED;border:1px solid #FED7AA;padding:6px 12px;border-radius:8px}

/* QUIZ */
.quiz-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.quiz-prog{font-size:12px;color:#64748b;background:#f1f5f9;padding:4px 12px;border-radius:999px}
.quiz-score-live{font-size:12px;color:#92400E;background:#FFF7ED;padding:4px 12px;border-radius:999px}
.quiz-q{font-size:15.5px;font-weight:600;margin-bottom:18px;line-height:1.55;color:#1a202c}
.quiz-opts{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.qopt{padding:13px 17px;border-radius:10px;border:1.5px solid #e2e8f0;background:#fff;font-size:14px;color:#1a202c;cursor:pointer;text-align:left;transition:all 0.15s;line-height:1.5}
.qopt:hover{border-color:#C2410C;background:#FEF2F2}
.qopt.correct{background:#F0FDF4;border-color:#16A34A;color:#14532D}
.qopt.wrong{background:#FEF2F2;border-color:#DC2626;color:#450A0A}
.fb{padding:13px 17px;border-radius:10px;font-size:13.5px;margin-bottom:14px;line-height:1.7}
.fb.correct{background:#F0FDF4;color:#14532D;border:1px solid #BBF7D0}
.fb.wrong{background:#FEF2F2;color:#450A0A;border:1px solid #FECACA}

/* RESULTS */
.results-wrap{text-align:center;padding:32px 16px}
.score-big{font-size:64px;font-weight:800;color:#7B1B1B;line-height:1;letter-spacing:-2px}
.score-sub{font-size:14px;color:#64748b;margin:6px 0 18px}
.score-badge{display:inline-block;font-size:14px;font-weight:600;padding:10px 28px;border-radius:10px;margin-bottom:18px}
.score-badge.pass{background:#F0FDF4;color:#14532D;border:1px solid #BBF7D0}
.score-badge.fail{background:#FEF2F2;color:#450A0A;border:1px solid #FECACA}
.cert-box{background:linear-gradient(135deg,#7B1B1B 0%,#C2410C 100%);border-radius:14px;padding:28px;text-align:center;margin-top:18px}
.cert-label{font-size:11px;color:rgba(255,255,255,0.6);letter-spacing:0.5px;margin-bottom:4px}
.cert-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:6px}
.cert-detail{font-size:13px;color:rgba(255,255,255,0.7);line-height:1.6}
.cert-seal{font-size:48px;margin-bottom:8px}

/* MODULE INTRO */
.mod-intro{text-align:center;padding:28px 16px 14px}
.mod-label{font-size:12px;color:#94a3b8;margin-bottom:8px;letter-spacing:0.3px}
.mod-big-title{font-size:24px;font-weight:700;margin-bottom:10px;letter-spacing:-0.4px}
.mod-time-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#7B1B1B;background:#FEE2E2;padding:6px 16px;border-radius:999px;margin-bottom:16px}
.mod-overview{text-align:left;background:#f8fafc;border-radius:10px;padding:16px;margin:12px 0}
.mod-overview-title{font-size:12px;font-weight:600;color:#64748b;margin-bottom:8px;letter-spacing:0.3px}
.mod-overview-item{font-size:13px;color:#374151;padding:4px 0;border-bottom:1px solid #f1f5f9;display:flex;gap:8px}
.mod-overview-item:last-child{border-bottom:none}
.mod-overview-dot{color:#C2410C;font-weight:700}

/* LOCKED MODULE */
.locked-msg{text-align:center;padding:48px 24px}
.lock-icon{font-size:52px;margin-bottom:16px}
.lock-title{font-size:20px;font-weight:700;margin-bottom:8px}
.lock-body{font-size:14px;color:#64748b;line-height:1.7}

@media(max-width:640px){
  .def-grid{grid-template-columns:1fr}
  .ppe-grid{grid-template-columns:1fr 1fr}
  .hdr-timer{display:none}
  .cinfo{flex-direction:column}
  .cinfo-time{text-align:left}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">Volt<span>CE</span></div>
  <div class="hdr-right">
    <div class="hdr-timer" id="total-timer">Total: 0:00:00</div>
    <div class="hdr-prog">
      <div class="prog-bg"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
      <span class="prog-pct" id="prog-pct">0%</span>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="cinfo">
    <div>
      <div class="cinfo-title">Electrical Safety & OSHA Standards</div>
      <div class="pills">
        <span class="pill red">4.0 CEU hours</span>
        <span class="pill">Journeyman & Master Electrician</span>
        <span class="pill">OSHA 29 CFR 1910 / 1926</span>
        <span class="pill">⏱ Time-locked — minimum times enforced</span>
      </div>
    </div>
    <div class="cinfo-time">
      <div class="cinfo-time-big" id="course-time-display">0:00</div>
      <div class="cinfo-time-lbl">of 4:00 hrs</div>
    </div>
  </div>

  <div class="mod-nav" id="mod-nav"></div>
  <div id="mod-timer-bar" style="display:none" class="mod-timer-bar">
    <span>⏱</span>
    <span class="mt-time" id="mt-time">0:00</span>
    <div class="mt-bar-bg"><div class="mt-bar-fill" id="mt-bar" style="width:0%"></div></div>
    <span class="mt-label" id="mt-label">Module time</span>
  </div>
  <div id="content"></div>
</div>

<script>
// ─── TIMING CONFIG ────────────────────────────────────────────────────────────
// Slide minimum times in seconds (students CANNOT advance before these expire)
const SLIDE_MIN = 150; // 2.5 minutes per content slide
// Module minimum times in seconds: 60 + 65 + 60 + 55 = 240 min (4.0 hours)
const MOD_MINS = [60*60, 60*60, 60*60, 60*60];

// ─── COURSE DATA ─────────────────────────────────────────────────────────────
const MODULES = [
 {
  "title": "OSHA Electrical Standards Overview",
  "time": "60 min",
  "modMin": MOD_MINS[0],
  "overview": [
   "The OSH Act, the General Duty Clause and employer/employee duties",
   "29 CFR 1910 Subpart S (general industry) and 29 CFR 1926 Subpart K (construction)",
   "How consensus standards such as the NEC and NFPA 70E relate to OSHA",
   "Employer responsibilities: training, PPE, programs and recordkeeping",
   "Employee rights and responsibilities",
   "Qualified, unqualified and competent persons",
   "Recognizing electrical hazards on the job",
   "OSHA inspections, citations, recordkeeping and reporting"
  ],
  "slides": [
   {
    "tag": "M1·S1",
    "title": "The OSH Act: Where Workplace Electrical Safety Law Begins",
    "video": {
     "title": "Supplementary video: OSHA and electrical safety",
     "dur": "3–5 min"
    },
    "body": "The Occupational Safety and Health Act of 1970 (OSH Act) created the Occupational Safety and Health Administration (OSHA) to help ensure safe and healthful working conditions. For most private-sector employers, including electrical contractors, OSHA enforces two distinct kinds of employer duty: compliance with specific OSHA standards, and the General Duty Clause.",
    "def_grid": [
     {
      "term": "Section 5(a)(1) — General Duty",
      "body": "Each employer must furnish a place of employment free from recognized hazards that are causing or are likely to cause death or serious physical harm to employees."
     },
     {
      "term": "Section 5(a)(2) — Standards",
      "body": "Each employer must comply with the occupational safety and health standards issued under the Act, such as those in 29 CFR Parts 1910 and 1926."
     },
     {
      "term": "Section 5(b) — Employees",
      "body": "Each employee must comply with the standards, rules, regulations and orders that apply to his or her own actions and conduct."
     },
     {
      "term": "Section 11(c) — Anti-retaliation",
      "body": "Employees are protected from retaliation for exercising rights under the Act, such as reporting a hazard or injury. Deadlines for filing a complaint are short; contact OSHA promptly."
     }
    ],
    "keypoint": "Employers have two separate OSHA obligations: follow the specific standards that apply, and protect workers from other recognized serious hazards even where no specific standard exists.",
    "info": "The video is supplementary. Knowledge-check questions are based on the written lesson content. State plans: many states operate their own OSHA-approved occupational safety and health programs that must be at least as effective as federal OSHA. Always confirm which program covers your employer.",
    "refs": [
     "OSH Act Sec. 5",
     "OSH Act Sec. 11(c)",
     "29 CFR Parts 1910 and 1926"
    ]
   },
   {
    "tag": "M1·S2",
    "title": "Where the Electrical Rules Live: Part 1910 and Part 1926",
    "body": "OSHA's electrical requirements are spread across several parts of Title 29 of the Code of Federal Regulations. Which part applies depends mainly on the type of work and the industry, so electricians who move between maintenance work in existing facilities and construction work must know both.",
    "table": {
     "h": [
      "Rule set",
      "Generally applies to",
      "What it covers"
     ],
     "r": [
      [
       "29 CFR 1910 Subpart S (1910.301–1910.399)",
       "General industry",
       "Design safety standards for electrical systems (1910.302–1910.308); safety-related work practices (1910.331–1910.335); definitions (1910.399)"
      ],
      [
       "29 CFR 1926 Subpart K (1926.400–1926.449)",
       "Construction",
       "Installation safety requirements, safety-related work practices (including 1926.416 and 1926.417), environmental and equipment provisions, definitions (1926.449)"
      ],
      [
       "29 CFR 1910.147",
       "General industry",
       "Control of hazardous energy (lockout/tagout) when servicing and maintaining machines and equipment"
      ],
      [
       "29 CFR 1910.269",
       "General industry",
       "Electric power generation, transmission and distribution work"
      ],
      [
       "29 CFR 1926 Subpart V",
       "Construction",
       "Power transmission and distribution work"
      ]
     ]
    },
    "keypoint": "Lockout/tagout for work on electrical conductors and equipment in electric utilization installations is addressed by Subpart S (1910.333), not by 1910.147. The 1910.147 standard states that it does not cover exposure to electrical hazards from work on, near, or with conductors or equipment in electric utilization installations, which Subpart S covers. Module 2 explains how the two fit together.",
    "warning": "If you are unsure whether a job is governed by general industry or construction rules, or by the utility-worker standards, do not guess. Ask your employer's safety professional or contact OSHA.",
    "refs": [
     "29 CFR 1910 Subpart S",
     "29 CFR 1926 Subpart K",
     "29 CFR 1910.147(a)",
     "29 CFR 1910.269"
    ]
   },
   {
    "tag": "M1·S3",
    "title": "The General Duty Clause and Consensus Standards",
    "body": "OSHA cannot write a specific standard for every hazard. Where no specific standard applies, OSHA may cite an employer under the General Duty Clause. To do so, OSHA generally must show that the hazard existed, that it was recognized, that it was causing or likely to cause death or serious physical harm, and that a feasible and useful way to correct it existed.",
    "step_list": [
     "The employer failed to keep the workplace free of a hazard to which its employees were exposed.",
     "The hazard was recognized (by the employer, the industry, or common sense).",
     "The hazard was causing or likely to cause death or serious physical harm.",
     "A feasible and useful method existed to correct the hazard."
    ],
    "bullets": [
     "Consensus standards such as the National Electrical Code (NEC) and NFPA 70E are developed by standards organizations. They are not OSHA regulations unless OSHA incorporates them by reference.",
     "OSHA may nonetheless treat consensus standards as evidence of what is recognized industry practice and of feasible ways to abate a hazard.",
     "The NEC is primarily an installation standard; NFPA 70E addresses electrical safety in the workplace. Following them does not automatically guarantee compliance with every OSHA requirement, and OSHA requirements can differ from them.",
     "Licensed electricians must also follow their state and local licensing and code requirements, which are separate from OSHA."

     "OSH Act Sec. 5(a)(1)"
    ]
   },
   {
    "tag": "M1·S4",
    "title": "Employer Responsibilities for Electrical Safety",
    "body": "Employers are responsible for the safety of workers exposed to electrical hazards. For electrical work, that responsibility is carried out through a combination of specific standards and sound safety management.",
    "bullets": [
     "Comply with applicable standards, including Subpart S (general industry) or Subpart K (construction), and furnish a workplace free of recognized serious hazards.",
     "Train employees. In general industry, 1910.332 sets training requirements for employees who face a risk of electric shock not reduced to a safe level by the electrical installation requirements. In construction, 1926.21(b)(2) requires the employer to instruct each employee in recognizing and avoiding unsafe conditions and the regulations applicable to the work environment.",
     "Assess the workplace for hazards that require personal protective equipment (PPE) and provide required PPE. Under 1910.132, a written certification of the hazard assessment is required, and the employer must generally pay for required PPE (with limited exceptions such as ordinary clothing and non-specialty safety-toe footwear).",

     "Post the OSHA workplace poster, allow employees access to required records, and not retaliate against employees who exercise their rights."
    ],
    "keypoint": "On a multi-employer site, the host employer, general contractor and subcontractors can each have responsibilities. Clear communication about electrical hazards, energized systems and lockout procedures is essential.",
    "refs": [
     "29 CFR 1910.132",
     "29 CFR 1910.332",
     "29 CFR 1926.20(b)",
     "29 CFR 1926.21(b)(2)",
     "29 CFR Part 1904"
    ]

// ─── STATE ────────────────────────────────────────────────────────────────────
let curMod = 0, curSlide = 0, inQuiz = false, quizIdx = 0, answered = false, selOpt = null;
let modState = MODULES.map(() => ({started:false, slideDone:false, quizDone:false, score:0, timeSpent:0}));

// Timers
let totalSeconds = 0;
let slideSecondsLeft = 0, slideSecondsTotal = 0;
let modSecondsSpent = 0;
let slideTimerInt = null, modTimerInt = null, totalTimerInt = null;

// Video URLs stored per slide
let videoURLs = {};

// ─── TOTAL TIMER ──────────────────────────────────────────────────────────────
function startTotalTimer(){
  if(totalTimerInt) return;
  totalTimerInt = setInterval(()=>{
    totalSeconds++;
    document.getElementById('total-timer').textContent = 'Total: ' + fmtHMS(totalSeconds);
    document.getElementById('course-time-display').textContent = fmtHM(totalSeconds);
    updateProgress();
  },1000);
}

function fmtHMS(s){
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;
  return (h>0?h+':':'')+(h>0?String(m).padStart(2,'0'):m)+':'+String(ss).padStart(2,'0');
}
function fmtHM(s){
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);
  return h+':'+ String(m).padStart(2,'0');
}
function fmtMS(s){
  const m=Math.floor(s/60);
  return m+':'+String(s%60).padStart(2,'0');
}

// ─── SLIDE TIMER ──────────────────────────────────────────────────────────────
function startSlideTimer(minSeconds){
  clearInterval(slideTimerInt);
  slideSecondsLeft = minSeconds;
  slideSecondsTotal = minSeconds;
  updateSlideTimerUI();
  document.getElementById('btn-next').disabled = true;
  slideTimerInt = setInterval(()=>{
    slideSecondsLeft--;
    if(slideSecondsLeft <= 0){
      clearInterval(slideTimerInt);
      slideSecondsLeft = 0;
      document.getElementById('btn-next').disabled = false;
      const el = document.getElementById('slide-timer-wrap');
      if(el) el.innerHTML = '<span style="color:#16A34A;font-weight:600">✓ Minimum reading time met — you may continue</span>';
    } else {
      updateSlideTimerUI();
    }
  },1000);
}

function updateSlideTimerUI(){
  const el = document.getElementById('slide-timer-wrap');
  if(!el) return;
  const pct = Math.round((1-(slideSecondsLeft/slideSecondsTotal))*100);
  el.innerHTML = `<div class="slide-timer">
    <span class="t-icon">⏱</span>
    <span>Please review this slide — <strong class="t-remaining">${fmtMS(slideSecondsLeft)}</strong> remaining before continuing</span>
    <div class="t-bar-bg"><div class="t-bar-fill" style="width:${pct}%"></div></div>
  </div>`;
}

// ─── MODULE TIMER ─────────────────────────────────────────────────────────────
function startModTimer(){
  clearInterval(modTimerInt);
  modSecondsSpent = modState[curMod].timeSpent || 0;
  const bar = document.getElementById('mod-timer-bar');
  bar.style.display = 'flex';
  updateModTimerUI();
  modTimerInt = setInterval(()=>{
    modSecondsSpent++;
    modState[curMod].timeSpent = modSecondsSpent;
    updateModTimerUI();
  },1000);
}

function stopModTimer(){
  clearInterval(modTimerInt);
  if(curMod >= 0) modState[curMod].timeSpent = modSecondsSpent;
}

function updateModTimerUI(){
  const mod = MODULES[curMod];
  const target = mod.modMin;
  const pct = Math.min(100, Math.round(modSecondsSpent/target*100));
  const el = document.getElementById('mt-time');
  const bar = document.getElementById('mt-bar');
  const lbl = document.getElementById('mt-label');
  if(el) el.textContent = fmtHM(modSecondsSpent);
  if(bar) bar.style.width = pct+'%';
  const remaining = Math.max(0, target - modSecondsSpent);
  if(lbl) lbl.textContent = remaining > 0 ? fmtMS(remaining)+' remaining in module' : '✓ Module time complete';
}

function isModTimeComplete(){
  const mod = MODULES[curMod];
  return (modState[curMod].timeSpent || modSecondsSpent) >= mod.modMin;
}

// ─── PROGRESS ─────────────────────────────────────────────────────────────────
function updateProgress(){
  const done = modState.filter(m=>m.quizDone).length;
  const timePct = Math.min(100, Math.round(totalSeconds / (4*3600) * 100));
  const contentPct = Math.round(done/MODULES.length*100);
  const pct = Math.max(timePct, contentPct);
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-pct').textContent = pct+'%';
}

  const nav = document.getElementById('mod-nav');
  nav.innerHTML = '';
  MODULES.forEach((m,i)=>{
    const unlocked = i===0 || modState[i-1].quizDone;
    const btn = document.createElement('button');
    btn.className = 'mbtn' + (i===curMod?' active':'') + (modState[i].quizDone?' done':'') + (!unlocked?' locked':'');
    btn.textContent = 'M'+(i+1)+': '+m.title.split(' ').slice(0,3).join(' ')+'…';
    btn.title = m.title;
    if(!unlocked){ btn.onclick = ()=>{}; return nav.appendChild(btn); }
    btn.onclick = ()=>{
      if(i===curMod) return;
      stopModTimer();
      curMod=i; curSlide=0; inQuiz=false; quizIdx=0; answered=false; selOpt=null;
      startModTimer();
      render();
    };
    nav.appendChild(btn);
  });
}

// ─── VIDEO HELPER ─────────────────────────────────────────────────────────────
function getEmbedURL(url){
  if(!url) return null;
  const ytM = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\s]+)/);
  if(ytM) return 'https://www.youtube.com/embed/'+ytM[1]+'?rel=0';
  const viM = url.match(/vimeo\.com\/(\d+)/);
  if(viM) return 'https://player.vimeo.com/video/'+viM[1];
  return null;
}

function renderVideo(vid, slideKey){
  const stored = videoURLs[slideKey] || '';
  const embed = getEmbedURL(stored);
  return `<div class="vid-wrap"><div class="vid-inner" id="vid-inner-${slideKey}">
    ${embed
      ? `<iframe class="vid-frame" id="vid-frame-${slideKey}" style="display:block" src="${embed}" allowfullscreen></iframe>`
      : `<div class="vid-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
         <div class="vid-title">${vid.title}</div>
         <div class="vid-sub">Instructor video</div>
         <div class="vid-dur">⏱ ${vid.dur}</div>
         <div class="vid-url-row">
           <input class="vid-url-input" id="vid-url-${slideKey}" placeholder="Paste YouTube or Vimeo URL here…" value="${stored}">
           <button class="vid-url-btn" onclick="setVideoURL('${slideKey}')">Add video</button>
         </div>`
    }
  </div></div>`;
}

function setVideoURL(slideKey){
  const inp = document.getElementById('vid-url-'+slideKey);
  if(!inp) return;
  videoURLs[slideKey] = inp.value.trim();
  render();
}

// ─── CONTENT BLOCKS ───────────────────────────────────────────────────────────
function renderSlideContent(s, slideKey){
  let h = '';
  if(s.video) h += renderVideo(s.video, slideKey);
  h += `<div class="slide-body">${s.body}</div>`;
  if(s.keypoint) h += `<div class="keypoint">💡 ${s.keypoint}</div>`;
  if(s.warning) h += `<div class="warning">⚠️ ${s.warning}</div>`;
  if(s.info) h += `<div class="info-box">ℹ️ ${s.info}</div>`;
  if(s.refs) h += `<div style="margin-top:12px">${s.refs.map(r=>`<span class="code-ref">${r}</span>`).join('')}</div>`;
  if(s.bullets){ h+=`<div class="bullets">`;s.bullets.forEach(b=>{h+=`<div class="bi">${b}</div>`});h+=`</div>`}
  if(s.def_grid){ h+=`<div class="def-grid">`;s.def_grid.forEach(d=>{h+=`<div class="def-card"><div class="def-term">${d.term}</div><div class="def-body">${d.body}</div></div>`});h+=`</div>`}
  if(s.table){ h+=`<div style="overflow-x:auto"><table class="dtable"><thead><tr>${s.table.h.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;s.table.r.forEach(r=>{h+=`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`});h+=`</tbody></table></div>`}
  if(s.hierarchy){ h+=`<div class="hierarchy">`;s.hierarchy.forEach(r=>{h+=`<div class="hier-row" style="background:${r.bg};border:1.5px solid ${r.bc}"><div class="hier-num" style="color:${r.tc}">${r.n}</div><div><div class="hier-title" style="color:${r.tc}">${r.title}</div><div class="hier-sub" style="color:${r.tc}">${r.sub}</div></div></div>`});h+=`</div>`}
  if(s.ppe_cats){ h+=`<div class="ppe-grid">`;s.ppe_cats.forEach(p=>{h+=`<div class="ppe-cat" style="background:${p.bg};border-color:${p.bc}"><div class="ppe-num" style="color:${p.tc}">${p.num}</div><div class="ppe-cal" style="color:${p.tc}">${p.cal}</div><div class="ppe-items">${p.items}</div></div>`});h+=`</div>`}
  if(s.step_list){ h+=`<div class="step-list">`;s.step_list.forEach((t,i)=>{h+=`<div class="step-row"><div class="step-num">${i+1}</div><div class="step-text">${t}</div></div>`});h+=`</div>`}
  return h;
}

// ─── RENDER SLIDE ─────────────────────────────────────────────────────────────
function renderSlide(s){
  clearInterval(slideTimerInt);
  const slideKey = `m${curMod}_s${curSlide}`;
  const total = MODULES[curMod].slides.length;
  const isLast = curSlide === total-1;
  let h = `<div class="card">
    <div class="slide-tag"><span class="s-num">${s.tag} of ${total}</span><span class="s-pill">Lesson</span></div>
    <div class="slide-title">${s.title}</div>
    ${renderSlideContent(s, slideKey)}
    <div id="slide-timer-wrap"></div>
    <div class="nav-row">
      ${curSlide>0?'<button class="btn-prev" onclick="prevSlide()">← Back</button>':'<div></div>'}
      ${!isLast
        ? `<button id="btn-next" class="btn-next" onclick="nextSlide()">Next →</button>`
        : `<button id="btn-next" class="btn-next" onclick="goToQuiz()">Take knowledge check →</button>`
      }
    </div>
  </div>`;
  document.getElementById('content').innerHTML = h;
  startSlideTimer(SLIDE_MIN);
}

// ─── QUIZ RENDER ──────────────────────────────────────────────────────────────
function renderQuizQ(){
  clearInterval(slideTimerInt);
  const mod = MODULES[curMod];
  const q = mod.quiz[quizIdx];
  const total = mod.quiz.length;
  const isFinal = mod.isFinal;
  const correct = modState[curMod].score;

  let h = `<div class="card">
    <div class="quiz-header">
      <span class="s-pill">${isFinal?'🏆 Final Exam':'📝 Knowledge Check'}</span>
      <span class="quiz-prog">Question ${quizIdx+1} of ${total}</span>
      <span class="quiz-score-live">${correct} correct so far</span>
    </div>
    <div class="quiz-q">${q.q}</div>
    <div class="quiz-opts">`;
  q.opts.forEach((o,i)=>{
    let cls='qopt';
    if(answered){ if(i===q.correct) cls+=' correct'; else if(i===selOpt) cls+=' wrong'; }
    h+=`<button class="${cls}"${answered?' disabled':''} onclick="selectOpt(${i})">${String.fromCharCode(65+i)}. ${o}</button>`;
  });
  h+=`</div>`;
  if(answered){
    const pass = selOpt===q.correct;
    h+=`<div class="fb ${pass?'correct':'wrong'}">${pass?'✓ Correct — ':'✗ Incorrect — '}${q.explain}</div>
    <div class="nav-row"><div></div>
    <button class="btn-next" onclick="nextQ()">${quizIdx<total-1?'Next question →':'See results →'}</button></div>`;
  }
  h+=`</div>`;
  document.getElementById('content').innerHTML = h;
}

function renderResults(){
  const mod = MODULES[curMod];
  const total = mod.quiz.length;
  const score = modState[curMod].score;
  const pct = Math.round(score/total*100);
  const pass = pct >= 70;
  const isFinal = mod.isFinal;
  const modTimeOK = isModTimeComplete();

  if(pass && modTimeOK){ modState[curMod].quizDone = true; updateProgress(); renderNav(); }

  let h = `<div class="card"><div class="results-wrap">
    <div class="score-big">${pct}%</div>
    <div class="score-sub">${score} of ${total} questions correct</div>
    <div class="score-badge ${pass?'pass':'fail'}">${pass?(isFinal?'🎉 Course passed!':'✓ Module passed'):('✗ Below 70% — must retake')}</div>`;

  if(!modTimeOK && pass){
    h+=`<div style="background:#FFF7ED;border:1px solid #FED7AA;border-radius:10px;padding:14px;margin:12px 0;font-size:13.5px;color:#92400E">
      ⏱ You passed the quiz but have not yet completed the minimum module time (${fmtHM(mod.modMin)} required). Continue reviewing the material and your progress will be saved.
    </div><button class="btn-prev" style="margin-top:8px" onclick="backToSlides()">← Back to module content</button>`;
  } else if(!pass){
    h+=`<button class="btn-next" onclick="retakeQuiz()" style="margin-top:8px">Retake knowledge check</button>`;
  } else if(isFinal && pass && modTimeOK){
    h+=`</div><div class="cert-box">
      <div class="cert-seal">🏆</div>
      <div class="cert-label">Certificate of Completion</div>
      <div class="cert-title">Electrical Safety & OSHA Standards</div>
      <div class="cert-detail">4.0 CEU hours · Journeyman & Master Electrician<br>OSHA 29 CFR 1910 Subpart S / 29 CFR 1926 Subpart K / 1910.147 / 1910.333<br>Completed: ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}<br>Time on course: ${fmtHMS(totalSeconds)}</div>
    </div>`;
  } else if(pass && modTimeOK && curMod < MODULES.length-1){
    h+=`<div style="margin-top:12px"><button class="btn-next" onclick="nextMod()">Start Module ${curMod+2} →</button></div>`;
  }
  h+=`</div></div>`;
  document.getElementById('content').innerHTML = h;
}

// ─── ACTIONS ──────────────────────────────────────────────────────────────────
function selectOpt(i){
  if(answered) return;
  selOpt=i; answered=true;
  if(i===MODULES[curMod].quiz[quizIdx].correct) modState[curMod].score++;
  renderQuizQ();
}
function nextQ(){ quizIdx++; answered=false; selOpt=null; if(quizIdx>=MODULES[curMod].quiz.length) renderResults(); else renderQuizQ(); }
function retakeQuiz(){ quizIdx=0; answered=false; selOpt=null; modState[curMod].score=0; renderQuizQ(); }
function goToQuiz(){ modState[curMod].slideDone=true; inQuiz=true; quizIdx=0; answered=false; selOpt=null; modState[curMod].score=0; renderQuizQ(); }
function nextSlide(){ curSlide++; render(); }
function prevSlide(){ curSlide--; render(); }
function nextMod(){ stopModTimer(); curMod++; curSlide=0; inQuiz=false; quizIdx=0; answered=false; selOpt=null; modState[curMod].timeSpent=0; startModTimer(); render(); }
function backToSlides(){ inQuiz=false; curSlide=0; render(); }

// ─── MAIN RENDER ──────────────────────────────────────────────────────────────
function render(){
  renderNav();
  const mod = MODULES[curMod];

  if(inQuiz){
    if(modState[curMod].quizDone) renderResults();
    else renderQuizQ();
    return;
  }

  // Module intro
  if(!modState[curMod].started){
    modState[curMod].started = true;
    clearInterval(slideTimerInt);
    let h=`<div class="card"><div class="mod-intro">
      <div class="mod-label">Module ${curMod+1} of ${MODULES.length}</div>
      <div class="mod-big-title">${mod.title}</div>
      <div class="mod-time-badge">⏱ ${mod.time} minimum · ${mod.slides.length} lessons · ${mod.quiz.length} questions</div>
    </div>
    <div class="mod-overview">
      <div class="mod-overview-title">What you'll cover in this module</div>
      ${mod.overview.map(o=>`<div class="mod-overview-item"><span class="mod-overview-dot">▸</span>${o}</div>`).join('')}
    </div>
    <div class="nav-row"><div></div><button class="btn-next" onclick="beginMod()">Begin Module ${curMod+1} →</button></div>
    </div>`;
    document.getElementById('content').innerHTML = h;
    return;
  }

  renderSlide(mod.slides[curSlide]);
}

function beginMod(){ render(); }

// ─── INIT ─────────────────────────────────────────────────────────────────────

// Video map: slide key (m<module>_s<slide>, zero-based) -> YouTube video ID
const VID = {
  "m0_s0": "yMF7CLtAPkw",   // Module 1, lesson 1
  "m1_s5": "Np14M0du758",   // Module 2, lesson 6
  "m2_s0": "w0fvnY1JJWA",   // Module 3, lesson 1
  "m3_s4": "3xH-yLkMcYU"    // Module 4, lesson 5
};
Object.keys(VID).forEach(k => { videoURLs[k] = "https://www.youtube.com/watch?v=" + VID[k]; });

startTotalTimer();
startModTimer();
render();
</script>
